apiVersion: apps/v1
kind: Deployment
metadata:
  name: mrp
  namespace: uim-platform
  labels:
    app: mrp
    part-of: uim-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mrp
  template:
    metadata:
      labels:
        app: mrp
    spec:
      containers:
      - name: mrp
        image: uim-platform/mrp:latest
        ports:
        - containerPort: 8119
          protocol: TCP
        envFrom:
        - configMapRef:
            name: mrp-config
        livenessProbe:
          httpGet:
            path: /health
            port: 8119
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8119
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
