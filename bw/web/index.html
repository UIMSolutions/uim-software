<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BW Service Console</title>
  <style>
    :root {
      --ink: #122335;
      --sky: #c7e6ff;
      --sea: #2f6fed;
      --mint: #c4f2d0;
      --sand: #f7eed5;
      --paper: #f8fbff;
      --line: #bdd6ee;
      --danger: #c43d45;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 5% 10%, var(--sky) 0%, transparent 40%),
        radial-gradient(circle at 95% 20%, var(--mint) 0%, transparent 36%),
        linear-gradient(135deg, #f4fbff 0%, #fefbf2 100%);
      min-height: 100vh;
    }

    .shell {
      max-width: 1080px;
      margin: 0 auto;
      padding: 28px 16px 42px;
    }

    .hero {
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 16px 38px rgba(18, 35, 53, 0.08);
      animation: rise .6s ease-out both;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2vw, 2rem);
      letter-spacing: 0.02em;
    }

    p {
      margin: 10px 0 0;
      line-height: 1.55;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 24px rgba(18, 35, 53, 0.06);
      animation: rise .75s ease-out both;
    }

    .card:nth-child(2) { animation-delay: .08s; }
    .card:nth-child(3) { animation-delay: .16s; }

    label {
      display: block;
      margin: 8px 0 6px;
      font-weight: 600;
      font-size: 0.92rem;
    }

    input, select, textarea {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }

    textarea { min-height: 86px; resize: vertical; }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: var(--sea);
      transition: transform .12s ease, opacity .12s ease;
    }

    button.secondary {
      color: var(--ink);
      background: var(--sand);
    }

    button:active { transform: translateY(1px); }
    button:hover { opacity: .92; }

    pre {
      margin: 0;
      background: #102138;
      color: #e9f6ff;
      border-radius: 14px;
      padding: 14px;
      overflow: auto;
      min-height: 180px;
      font-family: "IBM Plex Mono", "Cascadia Code", monospace;
    }

    .status {
      margin-top: 10px;
      min-height: 20px;
      font-weight: 600;
    }

    .status.error { color: var(--danger); }
    .status.ok { color: #12764f; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>Business Warehouse Service Console</h1>
      <p>Manage BW business objects and call BW-style APIs from a single page. Add a bearer token, choose an object type, and test CRUD and query endpoints.</p>
    </section>

    <section class="grid">
      <article class="card">
        <h2>Connection</h2>
        <label for="token">Bearer Token</label>
        <input id="token" placeholder="token-value">

        <label for="roles">X-BW-Roles</label>
        <input id="roles" value="bw.admin">

        <label for="objectType">Object Type</label>
        <select id="objectType"></select>

        <label for="objectId">Object ID (for get/update/delete)</label>
        <input id="objectId" placeholder="example: I-123456789">
      </article>

      <article class="card">
        <h2>Payload</h2>
        <label for="payload">JSON Body</label>
        <textarea id="payload">{
  "technicalName": "ZCP_SALES",
  "businessName": "Sales Composite Provider",
  "semanticLayer": "Virtual Provider",
  "sourceSystem": "S4H",
  "lifecycleState": "active",
  "owner": "dwh.team",
  "description": "Consolidated sales provider",
  "metadata": {
    "domain": "sales",
    "criticality": "high"
  },
  "createdBy": "admin"
}</textarea>

        <div class="actions">
          <button data-op="list">List</button>
          <button data-op="get">Get</button>
          <button data-op="create">Create</button>
          <button data-op="update">Update</button>
          <button data-op="delete" class="secondary">Delete</button>
        </div>
      </article>

      <article class="card">
        <h2>Result</h2>
        <div class="actions">
          <button id="search">Search Models</button>
          <button id="catalog" class="secondary">API Catalog</button>
        </div>
        <div id="status" class="status"></div>
        <pre id="output">{ "message": "Ready" }</pre>
      </article>
    </section>
  </main>

  <script>
    const objectTypes = [
      "info-areas", "info-objects", "characteristics", "key-figures", "hierarchies",
      "data-sources", "transformations", "data-transfer-processes", "adsos",
      "open-hub-destinations", "composite-providers", "cubes", "multi-providers",
      "queries", "workbooks", "process-chains", "analysis-authorizations",
      "planning-models", "aggregation-levels", "planning-functions", "data-slices",
      "data-flows", "api-definitions", "audit-entries"
    ];

    const typeSelect = document.querySelector("#objectType");
    const output = document.querySelector("#output");
    const statusNode = document.querySelector("#status");

    objectTypes.forEach((type) => {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = type;
      typeSelect.appendChild(option);
    });

    function headers(withBody) {
      const token = document.querySelector("#token").value.trim();
      const roles = document.querySelector("#roles").value.trim();
      const h = {
        "Authorization": token ? `Bearer ${token}` : "",
        "X-BW-Roles": roles
      };
      if (withBody) h["Content-Type"] = "application/json";
      return h;
    }

    function setStatus(text, ok) {
      statusNode.textContent = text;
      statusNode.className = `status ${ok ? "ok" : "error"}`;
    }

    async function runRequest(url, options) {
      try {
        const response = await fetch(url, options);
        const text = await response.text();
        let payload = text;
        try { payload = JSON.parse(text); } catch (_) {}

        output.textContent = JSON.stringify(payload, null, 2);
        setStatus(`${response.status} ${response.statusText}`, response.ok);
      } catch (error) {
        output.textContent = JSON.stringify({ error: String(error) }, null, 2);
        setStatus("Network error", false);
      }
    }

    document.querySelectorAll("button[data-op]").forEach((button) => {
      button.addEventListener("click", async () => {
        const op = button.dataset.op;
        const objectType = typeSelect.value;
        const id = document.querySelector("#objectId").value.trim();
        const base = `/api/v1/bw/${objectType}`;

        if (op === "list") {
          return runRequest(base, { method: "GET", headers: headers(false) });
        }

        if (op === "get") {
          return runRequest(`${base}/${id}`, { method: "GET", headers: headers(false) });
        }

        if (op === "create") {
          return runRequest(base, {
            method: "POST",
            headers: headers(true),
            body: document.querySelector("#payload").value
          });
        }

        if (op === "update") {
          return runRequest(`${base}/${id}`, {
            method: "PUT",
            headers: headers(true),
            body: document.querySelector("#payload").value
          });
        }

        if (op === "delete") {
          return runRequest(`${base}/${id}`, { method: "DELETE", headers: headers(false) });
        }
      });
    });

    document.querySelector("#search").addEventListener("click", () => {
      runRequest("/api/v1/bw/search/models?q=sales", {
        method: "GET",
        headers: headers(false)
      });
    });

    document.querySelector("#catalog").addEventListener("click", () => {
      runRequest("/api/v1/bw/api-catalog", {
        method: "GET",
        headers: headers(false)
      });
    });
  </script>
</body>
</html>
