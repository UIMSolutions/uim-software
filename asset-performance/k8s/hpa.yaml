apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: asset-performance
  namespace: uim-platform
  labels:
    app: asset-performance
    part-of: uim-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: asset-performance
  minReplicas: 1
  maxReplicas: 4
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75
