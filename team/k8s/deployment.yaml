apiVersion: apps/v1
kind: Deployment
metadata:
  name: team
  namespace: uim-platform
  labels:
    app: team
    part-of: uim-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: team
  template:
    metadata:
      labels:
        app: team
    spec:
      containers:
      - name: team
        image: uim-platform/team:latest
        ports:
        - containerPort: 8150
          protocol: TCP
        envFrom:
        - configMapRef:
            name: team-config
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8150
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8150
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
