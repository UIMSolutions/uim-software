apiVersion: apps/v1
kind: Deployment
metadata:
  name: lean
  namespace: uim-platform
  labels:
    app: lean
    part-of: uim-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lean
  template:
    metadata:
      labels:
        app: lean
    spec:
      containers:
      - name: lean
        image: uim-platform/lean:latest
        ports:
        - containerPort: 8130
          protocol: TCP
        envFrom:
        - configMapRef:
            name: lean-config
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 8130
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 8130
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
