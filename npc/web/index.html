<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Planning Collaboration Console</title>
  <style>
    :root {
      --ink: #1a2233;
      --sea: #1f6feb;
      --sand: #f7f0df;
      --mint: #ddf7ea;
      --line: #c9d7ea;
      --paper: #f8fbff;
      --error: #c0343b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, #cfe8ff 0%, transparent 36%),
        radial-gradient(circle at 92% 18%, var(--mint) 0%, transparent 32%),
        linear-gradient(140deg, #f6fbff 0%, #fff8ea 100%);
      min-height: 100vh;
    }
    .shell { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
    .hero, .card {
      background: rgba(255,255,255,.88);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 14px 32px rgba(18,30,48,.08);
      animation: rise .6s ease both;
    }
    .hero { padding: 22px; }
    h1 { margin: 0; font-size: clamp(1.3rem, 2vw, 2rem); }
    p { margin: 10px 0 0; line-height: 1.55; }
    .grid { margin-top: 16px; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
    .card { padding: 16px; }
    label { display: block; margin: 8px 0 6px; font-weight: 600; font-size: .92rem; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
    }
    textarea { min-height: 92px; resize: vertical; }
    .actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
    button {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      color: #fff;
      background: var(--sea);
      cursor: pointer;
    }
    button.alt { background: var(--sand); color: var(--ink); }
    .status { margin-top: 10px; min-height: 20px; font-weight: 600; }
    .status.error { color: var(--error); }
    .status.ok { color: #0f7a4c; }
    pre {
      margin: 0;
      min-height: 190px;
      border-radius: 14px;
      background: #0f2239;
      color: #e8f5ff;
      padding: 14px;
      overflow: auto;
      font-family: "IBM Plex Mono", "Cascadia Code", monospace;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <h1>Business Network Planning Collaboration</h1>
      <p>Manage planning objects, run simulation requests, and inspect collaboration APIs from one place.</p>
    </section>
    <section class="grid">
      <article class="card">
        <h2>Connection</h2>
        <label for="token">Bearer Token</label>
        <input id="token" placeholder="token-value">
        <label for="roles">X-NPC-Roles</label>
        <input id="roles" value="npc.admin">
        <label for="objectType">Object Type</label>
        <select id="objectType"></select>
        <label for="objectId">Object ID</label>
        <input id="objectId" placeholder="example: DP-1001">
      </article>
      <article class="card">
        <h2>Payload</h2>
        <label for="payload">JSON Body</label>
        <textarea id="payload">{
  "technicalName": "DP_2026_Q3",
  "businessName": "Demand Plan Q3",
  "planningDomain": "Consensus Demand",
  "sourceSystem": "IBP",
  "lifecycleState": "active",
  "owner": "planner.team",
  "description": "Consensus demand plan for quarter",
  "metadata": {
    "horizon": "13 weeks",
    "region": "EMEA"
  },
  "createdBy": "planner.a"
}</textarea>
        <div class="actions">
          <button data-op="list">List</button>
          <button data-op="get">Get</button>
          <button data-op="create">Create</button>
          <button data-op="update">Update</button>
          <button data-op="delete" class="alt">Delete</button>
        </div>
      </article>
      <article class="card">
        <h2>Result</h2>
        <div class="actions">
          <button id="search">Search Plans</button>
          <button id="simulate">Run Simulation</button>
          <button id="catalog" class="alt">API Catalog</button>
        </div>
        <div id="status" class="status"></div>
        <pre id="output">{ "message": "Ready" }</pre>
      </article>
    </section>
  </main>
  <script>
    const objectTypes = [
      "organizations", "suppliers", "customers", "products", "locations", "resources",
      "capacities", "demand-plans", "supply-plans", "constrained-plans", "scenarios",
      "assumptions", "milestones", "exceptions", "alerts", "commitments", "allocations",
      "collaboration-threads", "comments", "attachments", "workflows", "approvals",
      "kpi-definitions", "kpi-values", "api-definitions", "audit-entries"
    ];

    const objectTypeSelect = document.querySelector("#objectType");
    const output = document.querySelector("#output");
    const statusNode = document.querySelector("#status");

    objectTypes.forEach((type) => {
      const option = document.createElement("option");
      option.value = type;
      option.textContent = type;
      objectTypeSelect.appendChild(option);
    });

    function headers(withBody) {
      const token = document.querySelector("#token").value.trim();
      const roles = document.querySelector("#roles").value.trim();
      const h = {
        "Authorization": token ? `Bearer ${token}` : "",
        "X-NPC-Roles": roles
      };
      if (withBody) h["Content-Type"] = "application/json";
      return h;
    }

    function setStatus(text, ok) {
      statusNode.textContent = text;
      statusNode.className = `status ${ok ? "ok" : "error"}`;
    }

    async function run(url, options) {
      try {
        const response = await fetch(url, options);
        const text = await response.text();
        let payload = text;
        try { payload = JSON.parse(text); } catch (_) {}
        output.textContent = JSON.stringify(payload, null, 2);
        setStatus(`${response.status} ${response.statusText}`, response.ok);
      } catch (error) {
        output.textContent = JSON.stringify({ error: String(error) }, null, 2);
        setStatus("Network error", false);
      }
    }

    document.querySelectorAll("button[data-op]").forEach((button) => {
      button.addEventListener("click", async () => {
        const op = button.dataset.op;
        const objectType = objectTypeSelect.value;
        const id = document.querySelector("#objectId").value.trim();
        const base = `/api/v1/npc/${objectType}`;

        if (op === "list") return run(base, { method: "GET", headers: headers(false) });
        if (op === "get") return run(`${base}/${id}`, { method: "GET", headers: headers(false) });
        if (op === "create") {
          return run(base, { method: "POST", headers: headers(true), body: document.querySelector("#payload").value });
        }
        if (op === "update") {
          return run(`${base}/${id}`, { method: "PUT", headers: headers(true), body: document.querySelector("#payload").value });
        }
        if (op === "delete") {
          return run(`${base}/${id}`, { method: "DELETE", headers: headers(false) });
        }
      });
    });

    document.querySelector("#search").addEventListener("click", () => {
      run("/api/v1/npc/search/plans?q=plan", { method: "GET", headers: headers(false) });
    });

    document.querySelector("#simulate").addEventListener("click", () => {
      run("/api/v1/npc/simulations", {
        method: "POST",
        headers: headers(true),
        body: JSON.stringify({
          scenarioId: "SC_MAIN",
          demandPlanId: "DP_2026_Q3",
          supplyPlanId: "SP_2026_Q3",
          horizon: "P12W",
          parameters: { objective: "service-level" }
        })
      });
    });

    document.querySelector("#catalog").addEventListener("click", () => {
      run("/api/v1/npc/api-catalog", { method: "GET", headers: headers(false) });
    });
  </script>
</body>
</html>
